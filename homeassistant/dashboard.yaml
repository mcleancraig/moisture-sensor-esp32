views:
  - type: sections
    sections:
      - type: grid
        cards:
          - type: vertical-stack
            title: Office Palm (99)
            cards:
              - type: horizontal-stack
                cards:
                  - type: gauge
                    entity: sensor.garden_moisture_sensor_99_moisture
                    needle: false
                    severity:
                      green: 40
                      yellow: 20
                      red: 0
                    name:
                      type: entity
                  - type: gauge
                    entity: sensor.garden_moisture_sensor_99_battery
                    name:
                      type: entity
                    severity:
                      green: 40
                      yellow: 20
                      red: 0
                    needle: true
              - type: entity
                entity: sensor.garden_moisture_sensor_99_last_seen
                name:
                  type: entity
              - type: custom:mushroom-chips-card
                chips:
                  - type: entity
                    entity: sensor.garden_moisture_sensor_99_firmware_version
                    icon: mdi:chip
                    content_info: state
                  - type: entity
                    entity: sensor.garden_moisture_sensor_99_rssi
                    icon: mdi:wifi
                    content_info: state
                  - type: entity
                    entity: select.garden_moisture_sensor_99_update_channel
                    icon: mdi:cellphone-arrow-down
                    content_info: state
        column_span: 1
        background:
          color: yellow
          opacity: 20
