<svg width="100%" viewBox="0 0 680 580" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Garden Soil Moisture Sensor — Production Wiring Diagram</title>
  <desc>Wiring diagram showing XIAO ESP32-C6 connected to HW-390 moisture sensor, 18650 battery with 1N5819 diode, and 2x200kΩ voltage divider for battery monitoring</desc>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ── XIAO ESP32-C6 (centre) ── -->
  <rect x="240" y="200" width="200" height="210" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="340" y="224" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#26215C">XIAO ESP32-C6</text>
  <text x="340" y="241" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#534AB7">Seeed Studio</text>

  <!-- Left pin labels -->
  <text x="248" y="272" font-family="sans-serif" font-size="10" fill="#26215C">3V3</text>
  <text x="248" y="294" font-family="sans-serif" font-size="10" fill="#26215C">GND</text>
  <text x="248" y="316" font-family="sans-serif" font-size="10" fill="#26215C">A0 (GPIO0)</text>
  <text x="248" y="338" font-family="sans-serif" font-size="10" fill="#26215C">A1 (GPIO1)</text>

  <!-- Right pin labels -->
  <text x="432" y="272" font-family="sans-serif" font-size="10" fill="#26215C" text-anchor="end">USB-C (flash)</text>
  <text x="432" y="294" font-family="sans-serif" font-size="10" fill="#26215C" text-anchor="end">BAT+</text>
  <text x="432" y="316" font-family="sans-serif" font-size="10" fill="#26215C" text-anchor="end">BAT−</text>

  <!-- Deep sleep note -->
  <text x="340" y="385" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#534AB7">deep sleep 15 min · wakes into setup()</text>
  <text x="340" y="398" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#534AB7">OTA 5 s window on each wake</text>

  <!-- Pin stubs left -->
  <line x1="240" y1="269" x2="220" y2="269" stroke="#888780" stroke-width="1"/>
  <line x1="240" y1="291" x2="220" y2="291" stroke="#888780" stroke-width="1"/>
  <line x1="240" y1="313" x2="220" y2="313" stroke="#888780" stroke-width="1"/>
  <line x1="240" y1="335" x2="220" y2="335" stroke="#888780" stroke-width="1"/>

  <!-- Pin stubs right -->
  <line x1="440" y1="269" x2="460" y2="269" stroke="#888780" stroke-width="1"/>
  <line x1="440" y1="291" x2="460" y2="291" stroke="#888780" stroke-width="1"/>
  <line x1="440" y1="313" x2="460" y2="313" stroke="#888780" stroke-width="1"/>

  <!-- BAT pads note -->
  <rect x="255" y="408" width="170" height="22" rx="4" fill="#C0DD97" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="340" y="422" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#173404">BAT pads on PCB underside · + right / − left</text>

  <!-- ── 18650 Battery (top left) ── -->
  <rect x="20" y="20" width="140" height="72" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="90" y="44" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A">18650 cell</text>
  <text x="90" y="61" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">3.7 V · 2000 mAh</text>
  <text x="90" y="78" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5F5E5A">protected cell recommended</text>
  <!-- Battery terminal stubs -->
  <line x1="160" y1="42" x2="180" y2="42" stroke="#5F5E5A" stroke-width="1"/>
  <line x1="160" y1="68" x2="180" y2="68" stroke="#5F5E5A" stroke-width="1"/>
  <text x="165" y="38" font-family="sans-serif" font-size="10" fill="#1D9E75">+</text>
  <text x="165" y="64" font-family="sans-serif" font-size="10" fill="#888780">−</text>

  <!-- ── 1N5819 Diode (top centre) ── -->
  <rect x="200" y="28" width="110" height="36" rx="6" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="255" y="44" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#412402">1N5819</text>
  <text x="255" y="57" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#633806">Schottky · anode left</text>
  <!-- Diode A/K labels -->
  <text x="198" y="42" text-anchor="end" font-family="sans-serif" font-size="9" fill="#1D9E75">A</text>
  <text x="312" y="42" font-family="sans-serif" font-size="9" fill="#1D9E75">K</text>

  <!-- Battery + → diode anode -->
  <path d="M180 42 L200 42" fill="none" stroke="#1D9E75" stroke-width="1.5"/>

  <!-- Diode cathode → junction node -->
  <line x1="310" y1="42" x2="490" y2="42" stroke="#1D9E75" stroke-width="1.5"/>
  <!-- Junction dot -->
  <circle cx="400" cy="42" r="3.5" fill="#1D9E75"/>

  <!-- Junction → BAT+ pad on XIAO -->
  <path d="M490 42 L490 291 L460 291" fill="none" stroke="#1D9E75" stroke-width="1.5"/>

  <!-- Battery − → BAT− pad -->
  <path d="M180 68 L500 68 L500 313 L460 313" fill="none" stroke="#888780" stroke-width="1.5"/>

  <!-- ── Voltage Divider (right side) ── -->
  <!-- Top resistor R1: junction → midpoint -->
  <rect x="530" y="100" width="96" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="578" y="115" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C">200 kΩ</text>
  <text x="578" y="127" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">R1</text>

  <!-- Junction → top of R1 -->
  <path d="M400 42 L400 80 L578 80 L578 100" fill="none" stroke="#1D9E75" stroke-width="1.5"/>

  <!-- R1 bottom → midpoint -->
  <line x1="578" y1="134" x2="578" y2="170" stroke="#1D9E75" stroke-width="1.5"/>

  <!-- Midpoint dot -->
  <circle cx="578" cy="170" r="3.5" fill="#BA7517"/>

  <!-- Midpoint label -->
  <text x="590" y="170" font-family="sans-serif" font-size="9" fill="#BA7517" dominant-baseline="central">midpoint → A0</text>

  <!-- Midpoint → A0 on XIAO -->
  <path d="M578 170 L578 190 L530 190 L530 313 L220 313" fill="none" stroke="#BA7517" stroke-width="1.5"/>

  <!-- Bottom resistor R2: midpoint → GND -->
  <rect x="530" y="200" width="96" height="34" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="578" y="215" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="500" fill="#04342C">200 kΩ</text>
  <text x="578" y="227" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">R2</text>

  <!-- Midpoint → top of R2 -->
  <line x1="578" y1="170" x2="578" y2="200" stroke="#888780" stroke-width="1.5"/>

  <!-- R2 bottom → GND rail -->
  <path d="M578 234 L578 260 L510 260 L510 291 L500 291" fill="none" stroke="#888780" stroke-width="1.5"/>

  <!-- GND junction dot where bat− meets divider GND -->
  <circle cx="500" cy="291" r="3.5" fill="#888780"/>

  <!-- GND rail → XIAO GND pin -->
  <path d="M500 291 L500 68" fill="none" stroke="none"/>

  <!-- ── HW-390 Moisture Sensor (bottom left) ── -->
  <rect x="20" y="390" width="160" height="88" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="100" y="414" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#04342C">HW-390</text>
  <text x="100" y="431" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#085041">capacitive moisture sensor</text>
  <text x="100" y="448" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">insert to white line only</text>
  <text x="100" y="465" text-anchor="middle" font-family="sans-serif" font-size="9" fill="#085041">≈200 mm cable</text>

  <!-- Sensor pin stubs -->
  <line x1="180" y1="416" x2="200" y2="416" stroke="#888780" stroke-width="1"/>
  <line x1="180" y1="434" x2="200" y2="434" stroke="#888780" stroke-width="1"/>
  <line x1="180" y1="452" x2="200" y2="452" stroke="#888780" stroke-width="1"/>
  <text x="185" y="412" font-family="sans-serif" font-size="9" fill="#1D9E75">VCC</text>
  <text x="185" y="430" font-family="sans-serif" font-size="9" fill="#888780">GND</text>
  <text x="185" y="448" font-family="sans-serif" font-size="9" fill="#BA7517">AOUT</text>

  <!-- Sensor VCC → XIAO 3V3 -->
  <path d="M200 416 L212 416 L212 269 L220 269" fill="none" stroke="#1D9E75" stroke-width="1.5"/>

  <!-- Sensor GND → GND rail -->
  <path d="M200 434 L208 434 L208 291 L220 291" fill="none" stroke="#888780" stroke-width="1.5"/>

  <!-- GND junction dot -->
  <circle cx="220" cy="291" r="3.5" fill="#888780"/>

  <!-- Sensor AOUT → A1 -->
  <path d="M200 452 L216 452 L216 335 L220 335" fill="none" stroke="#BA7517" stroke-width="1.5"/>

  <!-- ── Legend ── -->
  <rect x="20" y="540" width="640" height="32" rx="6" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
  <line x1="36" y1="556" x2="60" y2="556" stroke="#1D9E75" stroke-width="2"/>
  <text x="66" y="556" font-family="sans-serif" font-size="10" fill="#2C2C2A" dominant-baseline="central">VCC / 3.3 V / BAT+</text>
  <line x1="190" y1="556" x2="214" y2="556" stroke="#888780" stroke-width="2"/>
  <text x="220" y="556" font-family="sans-serif" font-size="10" fill="#2C2C2A" dominant-baseline="central">GND</text>
  <line x1="276" y1="556" x2="300" y2="556" stroke="#BA7517" stroke-width="2"/>
  <text x="306" y="556" font-family="sans-serif" font-size="10" fill="#2C2C2A" dominant-baseline="central">Analog signal / divider midpoint</text>
  <text x="640" y="556" text-anchor="end" font-family="sans-serif" font-size="9" fill="#888780" dominant-baseline="central">github.com/mcleancraig/moisture-sensor-esp32</text>
</svg>
